### 🏆 Coding Profiles
[![LeetCode](https://img.shields.io/badge/LeetCode-Invisiblehqck-orange?logo=leetcode&logoColor=white)](https://leetcode.com/Invisiblehqck/)

name: Update LeetCode Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Update stats
        uses: joshcai/leetcode-stats-action@main
        with:
          username: Invisiblehqck

      - name: Commit
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "update leetcode stats" || echo "no changes"
          git push
